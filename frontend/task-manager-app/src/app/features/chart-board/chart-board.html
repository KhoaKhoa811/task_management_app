<div class="chart-container">
  <div style="display: block; width: 450px; height: 450px;">
    <canvas baseChart
      [data]="pieChartData"
      [options]="pieChartOptions"
      [type]="pieChartType">
    </canvas>
  </div>
  
  <div style="display: block; width: 450px; height: 450px;">
    <canvas baseChart
      [data]="lineChartData"
      [options]="lineChartOptions"
      [type]="lineChartType">
    </canvas>
  </div>
</div>
